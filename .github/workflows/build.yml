name: Build & Release Windows Client

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '**/*.md'
    tags: ['v*']
  pull_request:
    paths-ignore:
      - 'README.md'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '可选：手动指定发布 Release 的标签（例如 v1.1.0）'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: shell-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Set up cached Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache-dependency-path: go.sum

      - name: Verify Go dependencies
        run: |
          go mod download
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go mod verify
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git diff --exit-code -- go.mod go.sum
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Run Windows unit and integration tests
        run: |
          go test -count=1 -timeout=3m -tags desktop,production,wv2runtime.download ./...
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Determine release version
        id: meta
        run: |
          $tag = ''
          if ('${{ github.ref_type }}' -eq 'tag') {
            $tag = '${{ github.ref_name }}'
          } elseif ('${{ inputs.release_tag }}') {
            $tag = '${{ inputs.release_tag }}'
          }
          $ver = if ($tag) { $tag.TrimStart('v') } else { '1.1.0' }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Compile and package Windows x64 executable
        run: ./.github/scripts/package-windows.ps1 -Version '${{ steps.meta.outputs.version }}'

      - name: Exercise packaged WebView2 application (CDP Smoke Test)
        run: |
          $runtimes = @("${env:ProgramFiles(x86)}/Microsoft/EdgeWebView/Application/*/msedgewebview2.exe",
                        "$env:LOCALAPPDATA/Microsoft/EdgeWebView/Application/*/msedgewebview2.exe")
          if (!(Get-Item -Path $runtimes -ErrorAction SilentlyContinue)) {
            $installer = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
            $signature = Get-AuthenticodeSignature -LiteralPath $installer
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notlike '*CN=Microsoft Corporation*') { throw 'Unexpected WebView2 bootstrapper signature.' }
            $setup = Start-Process -FilePath $installer -ArgumentList '/silent','/install' -WindowStyle Hidden -Wait -PassThru
            if ($setup.ExitCode) { throw "WebView2 setup exited $($setup.ExitCode)." }
          }
          node .github/scripts/smoke-windows.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Upload portable package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shell-Windows-x64
          path: build/release/
          if-no-files-found: error

      - name: Upload UI verification screenshots
        uses: actions/upload-artifact@v4
        with:
          name: Shell-Preview
          path: build/preview/*.png
          if-no-files-found: error

      - name: Publish GitHub Release
        if: steps.meta.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.meta.outputs.tag }}'
          $notes = @'
          ## Shell __TAG__

          面向 Windows 的轻量原生 SSH / SFTP 桌面客户端（Go 1.26 + Wails v2 + xterm.js v6）。

          ### v1.1.0 更新亮点
          - **强光高可读深色模式与同步终端配色**：升级深色外观至高对比石墨灰层级（强光下依然清晰易读），默认启用「跟随界面外观」成对商业级终端配色（Termius Dark/Light、Tokyo Night/Day、Catppuccin Mocha/Latte、Rosé Pine/Dawn、Nord Dark/Light、Dracula、GitHub Light、Solarized Light），并新增侧栏一键浅/深切换按钮。
          - **Windows 系统代理、直连与多级 SSH 跳板机**：新增纯 Go 系统代理检测（自动读取 Windows 注册表 `ProxyEnable` / `ProxyServer` / `ProxyOverride` 及环境变量），支持在「偏好设置 → 连接与指纹」配置全局默认出站网络（直连 / 系统代理 / SOCKS5 / HTTP），并在主机「跳板与代理」页按单机覆盖代理或配置最多 5 级 SSH 跳板链路。
          - **多平台导入自动识别跳板与代理**：导入 Netcatty、OpenSSH、MobaXterm、Xshell、PuTTY、SecureCRT、Tabby、Electerm、WindTerm 等配置时自动解析代理与跳板机关系（支持按别名/地址关联已有主机与多级链式跳板）。
          - **编辑主机免重输密码**：编辑已有主机时自动加载已加密保存的密码（支持明文切换查看），点击「仅保存」即持久化 DPAPI 凭据，修改 IP / 端口时默认沿用原密码。
          - **细节体验打磨**：接入 `simple-icons` 官方发行版矢量图标；优化长 IPv6 地址中段缩略与悬浮一键复制；整体调大组件与字号比例；左侧主机栏新增排序菜单并修复新导入主机误入「最近使用」；终端增加底部留白防止末行贴底；标题栏最大化/还原按钮随窗口状态实时切换单框/双框图标；系统托盘右键精简为「断开全部会话」与「退出 Shell」。

          ### 核心特性
          - **低延迟 SSH 引擎与网络传输**：本机回环二进制 WebSocket 终端数据流、零休眠状态采集、`TCP_NODELAY` 与快速回退拨号；支持密码 / 私钥 / Windows OpenSSH Agent / 交互式 2FA、多级跳板机（`ProxyJump`）、`ForwardAgent`、KeepAlive 与 RTT 延迟监控。
          - **SFTP、端口转发与资产管理**：侧边 SFTP 文件管理（拖放上传、进度队列、`chmod`、在线编辑）、`-L / -R / -D` 端口转发隧道、轻量 Linux 实时监控、Ed25519 / RSA-4096 密钥生成及 `AES-256-GCM` 加密备份。
          - **AI 助手与 MCP 集成**：支持自定义 OpenAI 兼容 API 与本地 AI CLI（Claude Code / Codex CLI / Gemini CLI），内置 MCP `2025-03-26` 本地桥接服务（Streamable HTTP + `Shell.exe --mcp` stdio），配套结构化命令权限引擎、自动脱敏、交互审批与 JSONL 审计日志。

          ### 发行产物与升级说明
          - `Shell-Windows-x64.exe`：单文件便携版可执行程序（无需安装）
          - `Shell-Windows-x64.zip`：便携压缩包（仅含可执行文件、说明文档与开源许可）
          - `SHA256SUMS.txt`：SHA-256 校验值文件
          - **覆盖升级**：所有用户配置、主机列表与加密凭据独立存放在 `%LOCALAPPDATA%\Shell`，升级时先在托盘右键选择「退出 Shell」，再直接替换 `.exe` 或解压覆盖即可保留全部数据。
          '@
          $notes = $notes.Replace('__TAG__', $tag)
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $notes | Set-Content -LiteralPath $notesFile -Encoding utf8

          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag build/release/Shell-Windows-x64.exe build/release/Shell-Windows-x64.zip build/release/SHA256SUMS.txt --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            gh release edit $tag --title "Shell $tag" --notes-file $notesFile --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          } else {
            gh release create $tag build/release/Shell-Windows-x64.exe build/release/Shell-Windows-x64.zip build/release/SHA256SUMS.txt --title "Shell $tag" --notes-file $notesFile --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }

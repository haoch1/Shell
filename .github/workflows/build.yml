name: Build & Release Windows Client

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '**/*.md'
    tags: ['v*']
  pull_request:
    paths-ignore:
      - 'README.md'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '可选：发布与 frontend/package.json 版本一致的 v 开头标签'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: shell-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Verify release version, lockfile and changelog
        id: meta
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node .github/scripts/release-metadata.mjs

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --experimental-strip-types --test tests/sessionAttempt.test.mjs tests/paneLayout.test.mjs tests/hostDisplay.test.mjs tests/terminalHighlight.test.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Set up cached Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache-dependency-path: go.sum

      - name: Verify Go dependencies
        run: |
          go mod download
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go mod verify
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git diff --exit-code -- go.mod go.sum
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Run Windows unit and integration tests
        run: |
          go test -count=1 -timeout=3m -tags desktop,production,wv2runtime.download ./...
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go test -run '^$' -bench '^BenchmarkStdioDiscovery' -benchmem -benchtime=1s ./internal/agentbridge
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go test -run '^$' -bench '^(BenchmarkSFTPDirectoryBrowse|BenchmarkSFTPTransfer)$' -benchmem -benchtime=3x ./internal/remote
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Compile and package Windows x64 executable
        run: ./.github/scripts/package-windows.ps1

      - name: Exercise packaged WebView2 application (CDP Smoke Test)
        id: ui
        run: |
          $runtimes = @("${env:ProgramFiles(x86)}/Microsoft/EdgeWebView/Application/*/msedgewebview2.exe",
                        "$env:LOCALAPPDATA/Microsoft/EdgeWebView/Application/*/msedgewebview2.exe")
          if (!(Get-Item -Path $runtimes -ErrorAction SilentlyContinue)) {
            $installer = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
            $signature = Get-AuthenticodeSignature -LiteralPath $installer
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notlike '*CN=Microsoft Corporation*') { throw 'Unexpected WebView2 bootstrapper signature.' }
            $setup = Start-Process -FilePath $installer -ArgumentList '/silent','/install' -WindowStyle Hidden -Wait -PassThru
            if ($setup.ExitCode) { throw "WebView2 setup exited $($setup.ExitCode)." }
          }
          node .github/scripts/smoke-windows.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Save frontend bundle for failed UI checks
        if: failure() && steps.ui.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: Shell-UI-Diagnostics
          path: frontend/dist/
          retention-days: 1

      - name: Upload portable package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shell-Windows-x64
          path: build/release/
          if-no-files-found: error

      - name: Upload UI verification screenshots
        uses: actions/upload-artifact@v4
        with:
          name: Shell-Preview
          path: build/preview/*.png
          if-no-files-found: error

      - name: Publish GitHub Release
        if: steps.meta.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          $tag = $env:RELEASE_TAG
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'

          $buildCommit = git rev-parse HEAD
          $tagRefs = gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/$tag" --jq '.[].ref'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($tagRefs -contains "refs/tags/$tag") {
            $tagCommit = gh api "repos/$env:GITHUB_REPOSITORY/commits/$tag" --jq '.sha'
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            if ($tagCommit -ne $buildCommit) { throw "Release tag $tag points to a different commit." }
          }

          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag build/release/Shell-Windows-x64.exe build/release/Shell-Windows-x64.zip build/release/SHA256SUMS.txt --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            gh release edit $tag --title "Shell $tag" --notes-file $notesFile --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          } else {
            gh release create $tag build/release/Shell-Windows-x64.exe build/release/Shell-Windows-x64.zip build/release/SHA256SUMS.txt --target $buildCommit --title "Shell $tag" --notes-file $notesFile --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
